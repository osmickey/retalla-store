<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Placed — Retalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-page-bg">
<nav class="navbar navbar-transparent">
  <div class="container">
    <a href="/index.html" class="brand">Retalla</a>
  </div>
</nav>

<main class="container">
  <div class="auth-wrap" style="max-width:520px;text-align:center;">
    <div class="icon-circle" style="width:72px;height:72px;margin:0 auto 14px;background:#dcfce7;color:var(--success);" data-icon="check" data-icon-size="34"></div>
    <h2>Order Placed Successfully!</h2>
    <p class="sub">Thank you for shopping with Retalla. We'll notify you once your order ships.</p>
    <div id="order-success-detail" style="text-align:left;background:var(--primary-light);padding:16px;border-radius:var(--radius-sm);margin-bottom:20px;"></div>
    <a href="/account.html" class="btn btn-primary btn-block" style="margin-bottom:10px;">View My Orders</a>
    <a href="/shop.html" class="btn btn-outline btn-block">Continue Shopping</a>
  </div>
</main>
</div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/order-success.js"></script>
</body>
</html>
