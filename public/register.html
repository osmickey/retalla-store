<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Retalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-page-bg">
<nav class="navbar navbar-transparent">
  <div class="container">
    <a href="/index.html" class="brand">Retalla</a>
  </div>
</nav>

<main class="container">
  <div class="auth-wrap">
    <h2>Create Account</h2>
    <p class="sub">Join Retalla for exclusive deals</p>
    <div id="register-message" class="form-message" style="display:none;"></div>
    <form onsubmit="handleRegister(event)">
      <div class="field"><label>Full Name</label><input id="reg-name" required /></div>
      <div class="field"><label>Email</label><input id="reg-email" type="email" required /></div>
      <div class="field"><label>Phone Number</label><input id="reg-phone" pattern="[0-9]{10}" title="10 digit phone number" /></div>
      <div class="field"><label>Password</label><input id="reg-password" type="password" required minlength="6" /></div>
      <button id="register-submit" type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="/login.html">Login</a></div>
  </div>
</main>
</div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
