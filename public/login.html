<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Retalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-page-bg">
<nav class="navbar navbar-transparent">
  <div class="container">
    <a href="/index.html" class="brand">Retalla</a>
  </div>
</nav>

<main class="container">
  <div class="auth-wrap">
    <h2>Welcome Back</h2>
    <p class="sub">Login to continue shopping</p>
    <div id="login-message" class="form-message" style="display:none;"></div>
    <form onsubmit="handleLogin(event)">
      <div class="field"><label>Email</label><input id="login-email" type="email" required /></div>
      <div class="field">
        <label>Password</label>
        <div class="password-field">
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', this)" aria-label="Show password"><span data-icon="eye" data-icon-size="18"></span></button>
          <input id="login-password" type="password" required minlength="6" />
        </div>
        <a href="/forgot-password.html" class="forgot-link">Forgot password?</a>
      </div>
      <button id="login-submit" type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <div class="auth-switch">New to Retalla? <a href="/register.html">Create an account</a></div>
  </div>
</main>
</div>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/tabbar.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
