<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop All Products — Retalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="brand">Retalla</a>
    <form class="search-form" action="/shop.html" method="get">
      <input id="shop-search-input" type="text" name="search" placeholder="Search for gadgets, fashion, beauty & more..." />
      <button type="submit">🔍</button>
    </form>
    <div class="nav-actions">
      <a id="nav-account" class="nav-icon-link" href="/login.html">
        <span class="icon">👤</span><span>Login</span>
      </a>
      <a class="nav-icon-link" href="/cart.html">
        <span class="icon">🛒</span><span>Cart</span>
        <span class="cart-badge" id="cart-count">0</span>
      </a>
    </div>
  </div>
</nav>
<div class="category-nav">
  <div class="container category-nav-list"></div>
</div>

<main class="container">
  <div class="breadcrumb"><a href="/index.html">Home</a> / <span id="shop-title">All Products</span></div>

  <div class="category-nav" style="border:none;margin-bottom:20px;">
    <div class="container" id="shop-categories" style="padding:0;display:flex;gap:6px;flex-wrap:wrap;"></div>
  </div>

  <section class="section" style="margin-top:0;">
    <div class="product-grid" id="shop-grid"><div class="loading">Loading products...</div></div>
  </section>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom">© 2026 Retalla. All rights reserved.</div>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/main.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
