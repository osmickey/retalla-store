<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop All Products — Retalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
    <a href="/index.html" class="brand">Retalla</a>
    <form class="search-form" action="/shop.html" method="get">
      <input id="shop-search-input" type="text" name="search" placeholder="Search for gadgets, fashion, beauty & more..." />
      <button type="submit"><span class="icon" data-icon="search" data-icon-size="18"></span></button>
    </form>
    <div class="nav-actions">
      <button class="search-toggle-btn" id="search-toggle-btn" type="button" aria-label="Search"><span data-icon="search" data-icon-size="20"></span></button>
      <a class="nav-icon-link nav-desktop-only" href="/customer-service.html">
        <span class="icon" data-icon="support"></span><span>Support</span>
      </a>
      <a id="nav-account" class="nav-icon-link" href="/login.html">
        <span class="icon" data-icon="user"></span><span>Login</span>
      </a>
      <a class="nav-icon-link" href="/cart.html">
        <span class="icon" data-icon="cart"></span><span>Cart</span>
        <span class="cart-badge" id="cart-count">0</span>
      </a>
    </div>
  </div>
  <div class="mobile-drawer" id="mobile-drawer">
    <a href="/index.html"><span data-icon="home" data-icon-size="18"></span> Home</a>
    <a href="/login.html"><span data-icon="user" data-icon-size="18"></span> Login</a>
    <a href="/account.html"><span data-icon="box" data-icon-size="18"></span> My Orders</a>
    <a href="/cart.html"><span data-icon="cart" data-icon-size="18"></span> Cart</a>
    <a href="/customer-service.html"><span data-icon="support" data-icon-size="18"></span> Customer Service</a>
    <div class="drawer-categories"></div>
  </div>
</nav>
<div class="category-nav">
  <div class="container category-nav-list"></div>
</div>

<main class="container">
  <div class="breadcrumb"><a href="/index.html">Home</a> / <span id="shop-title">All Products</span></div>

  <div class="category-nav" style="border:none;margin-bottom:20px;">
    <div class="container" id="shop-categories" style="padding:0;display:flex;gap:6px;flex-wrap:wrap;"></div>
  </div>

  <section class="section" style="margin-top:0;">
    <div class="product-grid" id="shop-grid"><div class="dot-loader"><span></span><span></span><span></span></div></div>
  </section>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom">© 2026 Retalla. All rights reserved.</div>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/animate.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/main.js"></script>
<script src="/js/mobile-nav.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
