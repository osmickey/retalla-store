<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart — Retalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="brand">Retalla</a>
    <form class="search-form" action="/shop.html" method="get">
      <input type="text" name="search" placeholder="Search for gadgets, fashion, beauty & more..." />
      <button type="submit">🔍</button>
    </form>
    <div class="nav-actions">
      <a id="nav-account" class="nav-icon-link" href="/login.html">
        <span class="icon">👤</span><span>Login</span>
      </a>
      <a class="nav-icon-link" href="/cart.html">
        <span class="icon">🛒</span><span>Cart</span>
        <span class="cart-badge" id="cart-count">0</span>
      </a>
    </div>
  </div>
</nav>

<main class="container">
  <div class="breadcrumb"><a href="/index.html">Home</a> / <span>Cart</span></div>
  <h1 style="margin-bottom:20px;">Shopping Cart</h1>

  <div id="cart-empty" class="empty-state" style="display:none;">
    <div class="icon">🛒</div>
    <p>Your cart is empty.</p>
    <a class="btn btn-primary" href="/shop.html">Continue Shopping</a>
  </div>

  <div id="cart-layout" class="cart-layout">
    <div id="cart-items-list"></div>
    <div class="summary-card">
      <h3>Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">Rs. 0.00</span></div>
      <div class="summary-row"><span>Shipping</span><span id="summary-shipping">FREE</span></div>
      <div class="summary-row total"><span>Total</span><span id="summary-total">Rs. 0.00</span></div>
      <button class="btn btn-primary btn-block" onclick="goToCheckout()">Proceed to Checkout</button>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom">© 2026 Retalla. All rights reserved.</div>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/cart-page.js"></script>
</body>
</html>
