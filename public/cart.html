<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart — Retalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <button class="hamburger-btn" id="hamburger-btn" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
    <a href="/index.html" class="brand">Retalla</a>
    <form class="search-form" action="/shop.html" method="get">
      <input type="text" name="search" placeholder="Search for gadgets, fashion, beauty & more..." />
      <button type="submit"><span class="icon" data-icon="search" data-icon-size="18"></span></button>
    </form>
    <div class="nav-actions">
      <button class="search-toggle-btn" id="search-toggle-btn" type="button" aria-label="Search"><span data-icon="search" data-icon-size="20"></span></button>
      <a class="nav-icon-link nav-desktop-only" href="/customer-service.html">
        <span class="icon" data-icon="support"></span><span>Support</span>
      </a>
      <a id="nav-account" class="nav-icon-link" href="/login.html">
        <span class="icon" data-icon="user"></span><span>Login</span>
      </a>
      <a class="nav-icon-link" href="/cart.html">
        <span class="icon" data-icon="cart"></span><span>Cart</span>
        <span class="cart-badge" id="cart-count">0</span>
      </a>
    </div>
  </div>
  <div class="mobile-drawer" id="mobile-drawer">
    <a href="/index.html"><span data-icon="home" data-icon-size="18"></span> Home</a>
    <a href="/login.html"><span data-icon="user" data-icon-size="18"></span> Login</a>
    <a href="/account.html"><span data-icon="box" data-icon-size="18"></span> My Orders</a>
    <a href="/shop.html"><span data-icon="bag" data-icon-size="18"></span> Shop</a>
    <a href="/customer-service.html"><span data-icon="support" data-icon-size="18"></span> Customer Service</a>
    <div class="drawer-categories"></div>
  </div>
</nav>

<main class="container">
  <div class="breadcrumb"><a href="/index.html">Home</a> / <span>Cart</span></div>
  <h1 style="margin-bottom:20px;">Shopping Cart</h1>

  <div id="cart-empty" class="empty-state" style="display:none;">
    <div class="icon-circle" data-icon="cart" data-icon-size="30"></div>
    <p>Your cart is empty.</p>
    <a class="btn btn-primary" href="/shop.html">Continue Shopping</a>
  </div>

  <div id="cart-layout" class="cart-layout">
    <div id="cart-items-list"></div>
    <div class="summary-card">
      <h3>Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal">Rs. 0.00</span></div>
      <div class="summary-row savings" id="summary-savings-row" style="display:none;"><span>Discount</span><span id="summary-savings">− Rs. 0.00</span></div>
      <div class="summary-row"><span>Shipping</span><span id="summary-shipping">FREE</span></div>
      <div class="summary-row total"><span>Total</span><span id="summary-total">Rs. 0.00</span></div>
      <button class="btn btn-primary btn-block" onclick="goToCheckout()">Proceed to Checkout</button>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom">© 2026 Retalla. All rights reserved.</div>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/animate.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/mobile-nav.js"></script>
<script src="/js/cart-page.js"></script>
</body>
</html>
