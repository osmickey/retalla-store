<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — Retalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="brand">Retalla</a>
    <div class="nav-actions" style="margin-left:0;">
      <a id="nav-account" class="nav-icon-link" href="/login.html"><span class="icon" data-icon="user"></span><span>Login</span></a>
      <a class="nav-icon-link" href="/cart.html"><span class="icon" data-icon="cart"></span><span>Cart</span><span class="cart-badge" id="cart-count">0</span></a>
    </div>
  </div>
</nav>

<main class="container">
  <div class="breadcrumb"><a href="/index.html">Home</a> / <a href="/cart.html">Cart</a> / <span>Checkout</span></div>
  <h1 style="margin-bottom:20px;">Checkout</h1>

  <form class="checkout-layout" onsubmit="placeOrder(event)">
    <div>
      <div class="checkout-card">
        <h3 style="margin-bottom:16px;">Shipping Address</h3>
        <div class="field-row">
          <div class="field"><label>Full Name</label><input id="addr-name" required /></div>
          <div class="field"><label>Phone Number</label><input id="addr-phone" required pattern="[0-9]{10}" title="10 digit phone number" /></div>
        </div>
        <div class="field"><label>Address</label><textarea id="addr-line" rows="2" required></textarea></div>
        <div class="field-row">
          <div class="field"><label>City</label><input id="addr-city" required /></div>
          <div class="field"><label>State</label><input id="addr-state" required /></div>
        </div>
        <div class="field"><label>Pincode</label><input id="addr-pincode" required pattern="[0-9]{6}" title="6 digit pincode" /></div>
      </div>

      <div class="checkout-card">
        <h3 style="margin-bottom:16px;">Payment Method</h3>
        <div class="payment-option selected" onclick="selectPayment('COD', this)"><span data-icon="wallet" data-icon-size="18"></span> Cash on Delivery</div>
        <div class="payment-option" onclick="selectPayment('UPI', this)"><span data-icon="tag" data-icon-size="18"></span> UPI</div>
        <div class="payment-option" onclick="selectPayment('Card', this)"><span data-icon="receipt" data-icon-size="18"></span> Credit / Debit Card</div>
      </div>
    </div>

    <div>
      <div class="summary-card">
        <h3>Order Summary</h3>
        <div id="checkout-items" style="margin-bottom:12px;"></div>
        <div class="summary-row"><span>Subtotal</span><span id="co-subtotal">Rs. 0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="co-shipping">FREE</span></div>
        <div class="summary-row total"><span>Total</span><span id="co-total">Rs. 0.00</span></div>
        <button id="place-order-btn" type="submit" class="btn btn-primary btn-block">Place Order</button>
      </div>
    </div>
  </form>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom">© 2026 Retalla. All rights reserved.</div>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/animate.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
