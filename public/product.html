<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product — Retalla</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/index.html" class="brand">Retalla</a>
    <form class="search-form" action="/shop.html" method="get">
      <input type="text" name="search" placeholder="Search for gadgets, fashion, beauty & more..." />
      <button type="submit"><span class="icon" data-icon="search" data-icon-size="18"></span></button>
    </form>
    <div class="nav-actions">
      <a id="nav-account" class="nav-icon-link" href="/login.html">
        <span class="icon" data-icon="user"></span><span>Login</span>
      </a>
      <a class="nav-icon-link" href="/cart.html">
        <span class="icon" data-icon="cart"></span><span>Cart</span>
        <span class="cart-badge" id="cart-count">0</span>
      </a>
    </div>
  </div>
</nav>
<div class="category-nav">
  <div class="container category-nav-list"></div>
</div>

<main class="container">
  <div class="breadcrumb"><a href="/index.html">Home</a> / <a href="/shop.html">Shop</a> / <span>Product</span></div>
  <div class="product-detail" id="product-detail-wrap">
    <div class="dot-loader"><span></span><span></span><span></span></div>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom">© 2026 Retalla. All rights reserved.</div>
  </div>
</footer>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/api.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/animate.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/main.js"></script>
<script src="/js/product.js"></script>
</body>
</html>
