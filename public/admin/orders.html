<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orders — Retalla Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <a href="/admin/index.html" class="brand">Retalla<span>.</span>Admin</a>
    <nav>
      <a href="/admin/index.html"><span data-icon="dashboard" data-icon-size="18"></span> Dashboard</a>
      <a href="/admin/products.html"><span data-icon="box" data-icon-size="18"></span> Products</a>
      <a href="/admin/orders.html"><span data-icon="receipt" data-icon-size="18"></span> Orders</a>
      <a href="/admin/customers.html"><span data-icon="user" data-icon-size="18"></span> Customers</a>
      <a href="/admin/live-videos.html"><span data-icon="video" data-icon-size="18"></span> Retalla Live</a>
      <a href="/admin/banners.html"><span data-icon="tag" data-icon-size="18"></span> Home Banners</a>
    </nav>
    <button class="logout-btn" onclick="adminAuth.logout()"><span data-icon="logout" data-icon-size="16"></span> Logout</button>
  </aside>

  <main class="admin-main">
    <div class="admin-header"><h1>Orders</h1></div>

    <div class="panel">
      <div class="panel-head">
        <div class="filter-row">
          <select id="filter-status">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Processing">Processing</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Order ID</th><th>Customer</th><th>Items &amp; Product Code</th><th>Total</th><th>Status</th><th>Date</th><th>Tracking</th><th>Invoice</th></tr></thead>
          <tbody id="orders-body"><tr><td colspan="8" class="loading">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/js/icons.js"></script>
<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/orders.js"></script>
</body>
</html>
