<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products — Retalla Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar">
    <a href="/admin/index.html" class="brand">Retalla<span>.</span>Admin</a>
    <nav>
      <a href="/admin/index.html"><span data-icon="dashboard" data-icon-size="18"></span> Dashboard</a>
      <a href="/admin/products.html"><span data-icon="box" data-icon-size="18"></span> Products</a>
      <a href="/admin/orders.html"><span data-icon="receipt" data-icon-size="18"></span> Orders</a>
    </nav>
    <button class="logout-btn" onclick="adminAuth.logout()"><span data-icon="logout" data-icon-size="16"></span> Logout</button>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Products</h1>
      <button class="btn btn-primary" onclick="openAddModal()"><span data-icon="plus" data-icon-size="16"></span> Add Product</button>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="filter-row">
          <select id="filter-category"></select>
          <input id="filter-search" type="text" placeholder="Search products..." style="padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);" />
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Tags</th><th>Actions</th></tr></thead>
          <tbody id="products-body"><tr><td colspan="7" class="loading">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="product-modal" style="display:none;">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Add Product</h3>
      <button class="modal-close" onclick="closeProductModal()"><span data-icon="close" data-icon-size="18"></span></button>
    </div>
    <div id="product-modal-message" class="form-message error" style="display:none;"></div>
    <form id="product-form" onsubmit="submitProductForm(event)">
      <div class="field"><label>Product Name</label><input id="p-name" required /></div>
      <div class="field"><label>Description</label><textarea id="p-description" rows="3"></textarea></div>
      <div class="field-row">
        <div class="field"><label>Category</label><select id="p-category"></select></div>
        <div class="field"><label>Image URL</label><input id="p-image" required placeholder="https://..." /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Price (Rs.)</label><input id="p-price" type="number" min="0" step="0.01" required /></div>
        <div class="field"><label>MRP (Rs.)</label><input id="p-mrp" type="number" min="0" step="0.01" required /></div>
      </div>
      <div class="field"><label>Stock Quantity</label><input id="p-stock" type="number" min="0" required /></div>
      <div class="checkbox-row" style="margin-bottom:18px;">
        <label><input id="p-featured" type="checkbox" /> Featured</label>
        <label><input id="p-bestseller" type="checkbox" /> Best Seller</label>
      </div>
      <button id="product-submit-btn" type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Save Product</button>
    </form>
  </div>
</div>

<script src="/js/icons.js"></script>
<script src="/admin/js/admin-api.js"></script>
<script src="/admin/js/products.js"></script>
</body>
</html>
